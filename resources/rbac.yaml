apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-restarter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-binding
subjects:
  - kind: ServiceAccount
    name: remediation-sa
roleRef:
  kind: Role
  name: pod-restarter
  apiGroup: rbac.authorization.k8s.io
