# webhook-source.yaml
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: webhook
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    # This defines an endpoint http://<ip>:12000/remediate
    remediate:
      port: "12000"
      method: "POST"
      endpoint: "/remediate"
